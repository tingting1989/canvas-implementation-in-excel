<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>查找与替换</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
                background: #2b2b2b;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            /* ===== 对话框容器 ===== */
            .dialog {
                width: 460px;
                background: #3c3f41;
                border: 1px solid #555;
                border-radius: 4px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                overflow: hidden;
                color: #ccc;
            }

            /* ===== Tab 头部 ===== */
            .tab-header {
                display: flex;
                background: #3c3f41;
                border-bottom: 1px solid #555;
            }
            .tab-header .tab-btn {
                flex: 1;
                padding: 10px 0;
                text-align: center;
                cursor: pointer;
                font-size: 14px;
                color: #999;
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                transition: all 0.2s;
                user-select: none;
            }
            .tab-header .tab-btn:hover {
                color: #ddd;
            }
            .tab-header .tab-btn.active {
                color: #4a9ef5;
                border-bottom-color: #4a9ef5;
            }

            /* ===== Tab 内容区 ===== */
            .tab-body {
                padding: 18px 20px 14px;
            }

            .tab-panel {
                display: none;
            }
            .tab-panel.active {
                display: block;
            }

            /* ===== 输入行 ===== */
            .input-row {
                display: flex;
                align-items: center;
                margin-bottom: 12px;
            }
            .input-row label {
                width: 72px;
                font-size: 13px;
                color: #bbb;
                flex-shrink: 0;
            }
            .input-row input[type="text"] {
                flex: 1;
                height: 30px;
                padding: 0 8px;
                font-size: 13px;
                color: #eee;
                background: #4a4d4f;
                border: 1px solid #5a5d5f;
                border-radius: 3px;
                outline: none;
                transition: border-color 0.2s;
            }
            .input-row input[type="text"]:focus {
                border-color: #4a9ef5;
            }

            /* ===== 匹配选项 ===== */
            .options-row {
                display: flex;
                gap: 8px;
                margin-bottom: 6px;
                padding-left: 72px;
            }
            .opt-btn {
                width: 30px;
                height: 26px;
                line-height: 24px;
                text-align: center;
                font-size: 12px;
                color: #aaa;
                background: #4a4d4f;
                border: 1px solid #5a5d5f;
                border-radius: 3px;
                cursor: pointer;
                user-select: none;
                transition: all 0.2s;
            }
            .opt-btn:hover {
                color: #eee;
                border-color: #777;
            }
            .opt-btn.on {
                color: #fff;
                background: #4a9ef5;
                border-color: #4a9ef5;
            }

            .result-info {
                padding-left: 72px;
                font-size: 12px;
                color: #888;
                margin-bottom: 4px;
                min-height: 18px;
            }

            /* ===== 底部按钮栏 ===== */
            .btn-bar {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                padding: 10px 20px;
                background: #353739;
                border-top: 1px solid #4a4d4f;
            }
            .btn-bar button {
                min-width: 80px;
                height: 30px;
                padding: 0 14px;
                font-size: 13px;
                border-radius: 3px;
                border: 1px solid #5a5d5f;
                cursor: pointer;
                transition: all 0.2s;
                user-select: none;
            }
            .btn-default {
                color: #ddd;
                background: #4a4d4f;
            }
            .btn-default:hover {
                background: #5a5d5f;
            }

            .btn-primary {
                color: #fff;
                background: #4a9ef5;
                border-color: #4a9ef5;
            }
            .btn-primary:hover {
                background: #3a8ee5;
            }

            /* ===== 演示区域 ===== */
            .demo-area {
                width: 460px;
                margin-top: 20px;
                background: #3c3f41;
                border: 1px solid #555;
                border-radius: 4px;
                padding: 14px 16px;
                color: #ccc;
                font-size: 13px;
                line-height: 1.8;
            }
            .demo-area h4 {
                color: #4a9ef5;
                margin-bottom: 8px;
                font-size: 13px;
            }
            .demo-area .text-content {
                background: #2b2b2b;
                border: 1px solid #4a4d4f;
                border-radius: 3px;
                padding: 10px 12px;
                min-height: 80px;
                white-space: pre-wrap;
                word-break: break-all;
            }
            .highlight {
                background: #4a9ef5;
                color: #fff;
                padding: 0 2px;
                border-radius: 2px;
            }
            .replaced {
                background: #5cb85c;
                color: #fff;
                padding: 0 2px;
                border-radius: 2px;
            }
        </style>
    </head>
    <body>
        <div>
            <!-- ========== 对话框 ========== -->
            <div class="dialog" id="dialog">
                <!-- Tab 头部 -->
                <div class="tab-header">
                    <button class="tab-btn active" data-tab="find">查找(D)</button>
                    <button class="tab-btn" data-tab="replace">替换(P)</button>
                </div>

                <!-- ===== 查找面板 ===== -->
                <div class="tab-body">
                    <div class="tab-panel active" id="panel-find">
                        <div class="input-row">
                            <label for="findInput">查找内容(N)</label>
                            <input type="text" id="findInput" placeholder="请输入要查找的内容" />
                        </div>

                        <div class="options-row">
                            <div class="opt-btn" id="optAa" title="区分大小写">Aa</div>
                            <div class="opt-btn" id="optW" title="全词匹配">W</div>
                            <div class="opt-btn" id="optRx" title="正则表达式">.*</div>
                        </div>

                        <div class="result-info" id="findResult"></div>
                    </div>

                    <!-- ===== 替换面板 ===== -->
                    <div class="tab-panel" id="panel-replace">
                        <div class="input-row">
                            <label for="replaceFindInput">查找内容(N)</label>
                            <input type="text" id="replaceFindInput" placeholder="请输入要查找的内容" />
                        </div>
                        <div class="input-row">
                            <label for="replaceWithInput">替换为(E)</label>
                            <input type="text" id="replaceWithInput" placeholder="请输入替换内容" />
                        </div>

                        <div class="options-row">
                            <div class="opt-btn" id="optAa2" title="区分大小写">Aa</div>
                            <div class="opt-btn" id="optW2" title="全词匹配">W</div>
                            <div class="opt-btn" id="optRx2" title="正则表达式">.*</div>
                        </div>

                        <div class="result-info" id="replaceResult"></div>
                    </div>
                </div>

                <!-- 底部按钮 -->
                <div class="btn-bar" id="btnBar">
                    <!-- 查找按钮组 -->
                    <div id="btns-find" style="display: flex; gap: 8px">
                        <button class="btn-default" id="btnFindAll">查找全部</button>
                        <button class="btn-default" id="btnPrev">上一个</button>
                        <button class="btn-primary" id="btnNext">下一个</button>
                        <button class="btn-default" id="btnCloseFind">关闭</button>
                    </div>
                    <!-- 替换按钮组 -->
                    <div id="btns-replace" style="display: none; gap: 8px">
                        <button class="btn-primary" id="btnReplaceAll">全部替换</button>
                        <button class="btn-default" id="btnReplace">替换</button>
                        <button class="btn-default" id="btnFindAll2">查找全部</button>
                        <button class="btn-default" id="btnPrev2">上一个</button>
                        <button class="btn-primary" id="btnNext2">下一个</button>
                        <button class="btn-default" id="btnCloseReplace">关闭</button>
                    </div>
                </div>
            </div>

            <!-- ========== 演示文本区域 ========== -->
            <div class="demo-area">
                <h4>📄 演示文本（用于查看查找/替换效果）</h4>
                <div class="text-content" id="demoText">
                    在软件工程中，设计模式（Design
                    Pattern）是对软件设计中普遍存在（反复出现）的各种问题，所提出的解决方案。设计模式并不是直接用来完成代码的编写，而是描述在各种不同情况下，要怎么解决问题的一种方案。面向对象设计模式通常以类别或对象来描述其中的关系和相互作用，但不涉及用来完成应用程序的特定类别或对象。设计模式能使不稳定依赖于相对稳定、具体依赖于相对抽象，避免会引起麻烦的紧耦合，以增强软件设计面对并适应变化的能力。
                </div>
            </div>
        </div>

        <script>
            /* ========== Tab 切换 ========== */
            const tabBtns = document.querySelectorAll(".tab-btn");
            const panels = { find: document.getElementById("panel-find"), replace: document.getElementById("panel-replace") };
            const btnGroups = { find: document.getElementById("btns-find"), replace: document.getElementById("btns-replace") };

            tabBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    tabBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    const tab = btn.dataset.tab;
                    panels.find.classList.toggle("active", tab === "find");
                    panels.replace.classList.toggle("active", tab === "replace");
                    btnGroups.find.style.display = tab === "find" ? "flex" : "none";
                    btnGroups.replace.style.display = tab === "replace" ? "flex" : "none";
                    doSearch(); // 切换 tab 时刷新结果
                });
            });

            /* ========== 匹配选项切换 ========== */
            function bindOpt(ids) {
                ids.forEach((id) => {
                    const el = document.getElementById(id);
                    el.addEventListener("click", () => el.classList.toggle("on"));
                });
            }
            bindOpt(["optAa", "optW", "optRx", "optAa2", "optW2", "optRx2"]);

            /* ========== 搜索核心逻辑 ========== */
            const demoText = document.getElementById("demoText");
            let originalText = demoText.textContent; // 原始文本
            let matches = []; // 匹配位置数组
            let curIdx = -1; // 当前选中索引

            function getOptions(prefix) {
                return {
                    caseSensitive: document.getElementById(prefix + "Aa").classList.contains("on"),
                    wholeWord: document.getElementById(prefix + "W").classList.contains("on"),
                    regex: document.getElementById(prefix + "Rx").classList.contains("on"),
                };
            }

            function buildRegex(keyword, opt) {
                if (!keyword) return null;
                let flags = "g";
                if (!opt.caseSensitive) flags += "i";
                let pattern = keyword;
                if (!opt.regex) pattern = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                if (opt.wholeWord) pattern = "\\b" + pattern + "\\b";
                try {
                    return new RegExp(pattern, flags);
                } catch (e) {
                    return null;
                }
            }

            function doSearch() {
                const isFind = document.getElementById("panel-find").classList.contains("active");
                const input = isFind ? document.getElementById("findInput") : document.getElementById("replaceFindInput");
                const resultEl = isFind ? document.getElementById("findResult") : document.getElementById("replaceResult");
                const keyword = input.value;
                const opt = getOptions(isFind ? "opt" : "opt");

                // 恢复原始文本
                demoText.textContent = originalText;

                if (!keyword) {
                    resultEl.textContent = "";
                    matches = [];
                    curIdx = -1;
                    return;
                }

                const re = buildRegex(keyword, opt);
                if (!re) {
                    resultEl.textContent = "无效的正则表达式";
                    return;
                }

                // 收集所有匹配
                matches = [];
                let m;
                while ((m = re.exec(originalText)) !== null) {
                    matches.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
                    if (m[0] === "") re.lastIndex++; // 防止空匹配死循环
                }

                if (matches.length === 0) {
                    resultEl.textContent = "未找到匹配项";
                    curIdx = -1;
                } else {
                    curIdx = curIdx < 0 ? 0 : Math.min(curIdx, matches.length - 1);
                    resultEl.textContent = `结果：${curIdx + 1}/${matches.length}`;
                }
                renderHighlight();
            }

            function renderHighlight() {
                if (matches.length === 0) {
                    demoText.textContent = originalText;
                    return;
                }
                let html = "";
                let last = 0;
                matches.forEach((m, i) => {
                    html += escapeHtml(originalText.slice(last, m.start));
                    const cls = i === curIdx ? "highlight" : "highlight";
                    html += `<span class="${cls}">${escapeHtml(m.text)}</span>`;
                    last = m.end;
                });
                html += escapeHtml(originalText.slice(last));
                demoText.innerHTML = html;
            }

            function escapeHtml(s) {
                return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            /* ========== 导航 ========== */
            function goNext() {
                if (matches.length === 0) {
                    doSearch();
                    return;
                }
                curIdx = (curIdx + 1) % matches.length;
                updateResult();
                renderHighlight();
            }
            function goPrev() {
                if (matches.length === 0) {
                    doSearch();
                    return;
                }
                curIdx = (curIdx - 1 + matches.length) % matches.length;
                updateResult();
                renderHighlight();
            }
            function updateResult() {
                const isFind = document.getElementById("panel-find").classList.contains("active");
                const el = isFind ? document.getElementById("findResult") : document.getElementById("replaceResult");
                el.textContent = `结果：${curIdx + 1}/${matches.length}`;
            }

            /* ========== 替换逻辑 ========== */
            function replaceCurrent() {
                if (curIdx < 0 || matches.length === 0) return;
                const newText = document.getElementById("replaceWithInput").value;
                const m = matches[curIdx];
                originalText = originalText.slice(0, m.start) + newText + originalText.slice(m.end);
                // 重新搜索
                curIdx = -1;
                doSearch();
                if (curIdx >= 0) renderHighlight();
            }

            function replaceAll() {
                const newText = document.getElementById("replaceWithInput").value;
                const re = buildRegex(document.getElementById("replaceFindInput").value, getOptions("opt"));
                if (!re) return;
                originalText = originalText.replace(re, newText);
                curIdx = -1;
                doSearch();
            }

            /* ========== 事件绑定 ========== */
            document.getElementById("findInput").addEventListener("input", () => {
                curIdx = -1;
                doSearch();
            });
            document.getElementById("replaceFindInput").addEventListener("input", () => {
                curIdx = -1;
                doSearch();
            });

            // 查找面板按钮
            document.getElementById("btnNext").addEventListener("click", goNext);
            document.getElementById("btnPrev").addEventListener("click", goPrev);
            document.getElementById("btnFindAll").addEventListener("click", () => {
                curIdx = -1;
                doSearch();
            });
            document.getElementById("btnCloseFind").addEventListener("click", () => {
                document.getElementById("dialog").style.display = "none";
            });

            // 替换面板按钮
            document.getElementById("btnNext2").addEventListener("click", goNext);
            document.getElementById("btnPrev2").addEventListener("click", goPrev);
            document.getElementById("btnFindAll2").addEventListener("click", () => {
                curIdx = -1;
                doSearch();
            });
            document.getElementById("btnReplace").addEventListener("click", replaceCurrent);
            document.getElementById("btnReplaceAll").addEventListener("click", replaceAll);
            document.getElementById("btnCloseReplace").addEventListener("click", () => {
                document.getElementById("dialog").style.display = "none";
            });

            // 回车键快捷查找
            document.getElementById("findInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") goNext();
            });
            document.getElementById("replaceFindInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") goNext();
            });

            /* 初始搜索 */
            doSearch();
        </script>
    </body>
</html>
