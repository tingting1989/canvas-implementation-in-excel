<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 FilterPlugin 功能演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            padding: 30px;
        }

        .canvas-container {
            background: #f8f9fa;
            padding: 20px;
            border: 1px solid #e9ecef;
            min-height: 500px;
        }

        #spreadsheet {
            width: 100%;
            height: 450px;
            background: white;
        }

        .control-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border: 2px solid #e9ecef;
            height: fit-content;
        }

        .panel-title {
            font-size: 1.3em;
            color: #495057;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            font-weight: 600;
        }

        .status-display {
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            margin-bottom: 20px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #6c757d;
            font-size: 13px;
        }

        .status-value {
            font-weight: 600;
            color: #667eea;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .column-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            max-height: 150px;
            overflow-y: auto;
        }

        .column-chip {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .column-chip:hover {
            background: #dee2e6;
        }

        .column-chip.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .column-chip input {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.6);
        }

        .log-panel {
            grid-column: 1 / -1;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #333;
        }

        .log-title {
            color: #4facfe;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-family: monospace;
            font-weight: 600;
        }

        .log-content {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #d4d4d4;
        }

        .log-entry {
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 4px;
            border-left: 4px solid transparent;
        }

        .log-success {
            background: rgba(56, 239, 125, 0.1);
            border-left-color: #38ef7d;
            color: #38ef7d;
        }

        .log-error {
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff6b6b;
            color: #ff6b6b;
        }

        .log-info {
            background: rgba(79, 172, 254, 0.1);
            border-left-color: #4facfe;
            color: #4facfe;
        }

        .log-warn {
            background: rgba(255, 193, 7, 0.1);
            border-left-color: #ffc107;
            color: #ffc107;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            font-size: 14px;
            color: #6c757d;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }

        .icon {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 FilterPlugin 功能演示</h1>
            <p>通过 filterableColumns 配置控制哪些列可以参与过滤</p>
        </div>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="spreadsheet"></canvas>
            </div>

            <div class="control-panel">
                <h3 class="panel-title">⚙️ 过滤配置</h3>

                <div class="status-display">
                    <div class="status-row">
                        <span class="status-label">激活的过滤器</span>
                        <span class="status-value" id="activeFilters">无</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">可见行数</span>
                        <span class="status-value" id="visibleRows">-</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">可过滤列</span>
                        <span class="status-value" id="filterableColsDisplay">-</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>🗂️ 选择可过滤的列（点击切换）</label>
                    <div class="column-selector" id="columnSelector">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <button class="btn btn-primary" onclick="applyFilterableColumns()">
                    <span class="icon">✅</span>
                    应用配置
                </button>

                <button class="btn btn-secondary" onclick="allowAllColumns()">
                    <span class="icon">🔓</span>
                    允许所有列过滤
                </button>

                <button class="btn btn-warning" onclick="disallowAllColumns()">
                    <span class="icon">🔒</span>
                    禁用所有列过滤
                </button>

                <button class="btn btn-info" onclick="clearAllFilters()">
                    <span class="icon">🧹</span>
                    清除所有过滤器
                </button>
            </div>

            <div class="log-panel">
                <h3 class="log-title">📋 操作日志</h3>
                <div class="log-content" id="logContent">
                    <div class="log-entry log-info">[系统] 页面加载完成，等待初始化...</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>系统就绪</span>
            </div>
            <div>
                CanvasSheet v2.1.0 | FilterPlugin Demo
            </div>
        </div>
    </div>

    <!-- 引入依赖 -->
    <script src="../../dist/canvas-sheet.umd.js"></script>

    <script>
        let workbook = null;
        let filterPlugin = null;
        const TOTAL_COLUMNS = 6;
        const COLUMN_LABELS = ['A', 'B', 'C', 'D', 'E', 'F'];
        const TOTAL_ROWS = 12;

        function log(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function initSpreadsheet() {
            try {
                log('开始初始化 Workbook...', 'info');

                const container = document.getElementById('spreadsheet');
                workbook = new CanvasSheet.Workbook(container, {
                    width: 900,
                    height: 530,
                    plugins: [
                        "autoFill",
                        "contextMenu",
                        "columnMove",
                        "copyPaste",
                        "exportFile",
                        "importFile",
                        "hiddenColumns",
                        "hiddenRows",
                        "rowMove",
                        "freeze",
                        "formula",
                        "sort",
                        "filter",
                        "dataValidation",
                    ],
                    pluginOptions: {
                        filter: {
                            // 允许过滤的列索引数组（0-based）
                            filterableColumns: [0, 2, 4]
                        },
                        sort: {
                            // 允许过滤的列索引数组（0-based）
                            filterableColumns: [0, 2, 4]
                        }
                    },
                    sheets: [{
                        name: "员工信息",
                        data: [
                            ["张三", 25, "北京", "技术部", 15000, "2020-03-15"],
                            ["李四", 30, "上海", "市场部", 18000, "2019-07-01"],
                            ["王五", 28, "广州", "技术部", 16000, "2021-01-10"],
                            ["赵六", 35, "深圳", "人事部", 20000, "2018-05-20"],
                            ["孙七", 27, "杭州", "技术部", 14000, "2022-02-28"],
                            ["周八", 32, "南京", "财务部", 17000, "2017-11-15"],
                            ["吴九", 29, "成都", "市场部", 15500, "2020-08-10"],
                            ["郑十", 31, "武汉", "技术部", 19000, "2019-03-25"],
                            ["王二", 26, "西安", "市场部", 14500, "2021-05-20"],
                            ["李三", 33, "苏州", "财务部", 18500, "2018-09-12"],
                            ["赵四", 29, "重庆", "技术部", 16500, "2020-11-30"],
                            ["孙五", 34, "天津", "人事部", 19500, "2017-06-08"],
                        ],
                        rowHeaderWidth: 120,
                        rowHeaders: [
                            { label: "序号", style: { textAlign: "center" } },
                            { label: "姓名", style: { textAlign: "center" } },
                            { label: "年龄", style: { textAlign: "center" } },
                            { label: "城市", style: { textAlign: "center" } },
                            { label: "部门", style: { textAlign: "center" } },
                            { label: "薪资", style: { textAlign: "center" } },
                            { label: "入职日期", style: { textAlign: "center" } }
                        ],
                        columns: [
                            { type: "text", width: 100 },
                            { type: "numeric", width: 80, numericFormat: { pattern: "0" } },
                            { type: "text", width: 100 },
                            { type: "text", width: 100 },
                            { type: "numeric", width: 100, numericFormat: { pattern: "$0,0" } },
                            { type: "date", width: 120 },
                        ],
                    }]
                });

                filterPlugin = workbook.getPlugin('filter');

                if (!filterPlugin) {
                    throw new Error('FilterPlugin 未找到');
                }

                log('✅ Workbook 初始化成功', 'success');
                log('✅ FilterPlugin 已加载', 'success');
                log(`📝 默认允许过滤的列: [${filterPlugin.filterableColumns?.map(c => COLUMN_LABELS[c]).join(', ') || '无'}]`, 'info');

                initColumnSelector();
                updateStatusDisplay();

            } catch (error) {
                log(`❌ 初始化失败: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function initColumnSelector() {
            const selector = document.getElementById('columnSelector');
            selector.innerHTML = '';

            const filterableColumns = filterPlugin.filterableColumns || [];

            for (let i = 0; i < TOTAL_COLUMNS; i++) {
                const chip = document.createElement('label');
                chip.className = 'column-chip' + (filterableColumns.includes(i) ? ' selected' : '');
                chip.innerHTML = `
                    <input type="checkbox" value="${i}" ${filterableColumns.includes(i) ? 'checked' : ''}>
                    列 ${COLUMN_LABELS[i]}
                `;
                chip.addEventListener('click', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    const checkbox = chip.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    chip.classList.toggle('selected', checkbox.checked);
                });
                chip.querySelector('input').addEventListener('change', (e) => {
                    chip.classList.toggle('selected', e.target.checked);
                });
                selector.appendChild(chip);
            }
        }

        function getSelectedColumns() {
            const checkboxes = document.querySelectorAll('#columnSelector input:checked');
            return Array.from(checkboxes).map(cb => parseInt(cb.value));
        }

        function applyFilterableColumns() {
            const selected = getSelectedColumns();
            filterPlugin.filterableColumns = selected;
            log(`✅ 已设置可过滤列: [${selected.map(c => COLUMN_LABELS[c]).join(', ') || '无'}]`, 'success');
            updateStatusDisplay();
        }

        function allowAllColumns() {
            const allColumns = Array.from({ length: TOTAL_COLUMNS }, (_, i) => i);
            filterPlugin.filterableColumns = allColumns;
            log(`✅ 已允许所有列过滤: [${COLUMN_LABELS.join(', ')}]`, 'success');
            initColumnSelector();
            updateStatusDisplay();
        }

        function disallowAllColumns() {
            filterPlugin.filterableColumns = [];
            log(`🔒 已禁用所有列过滤`, 'warn');
            initColumnSelector();
            updateStatusDisplay();
        }

        function clearAllFilters() {
            filterPlugin.clearAllFilters();
            log(`🧹 已清除所有过滤器`, 'info');
            updateStatusDisplay();
        }

        function updateStatusDisplay() {
            const filterableColumns = filterPlugin.filterableColumns || [];
            const filterState = workbook.getActiveSheet()?.filterState;
            let activeCount = 0;
            let activeList = [];

            if (filterState) {
                for (let i = 0; i < TOTAL_COLUMNS; i++) {
                    if (filterState.getColumnFilter(i) !== null) {
                        activeCount++;
                        activeList.push(COLUMN_LABELS[i]);
                    }
                }
            }

            document.getElementById('activeFilters').textContent =
                activeCount > 0 ? `列 ${activeList.join(', ')}` : '无';

            document.getElementById('visibleRows').textContent = TOTAL_ROWS;

            document.getElementById('filterableColsDisplay').textContent =
                filterableColumns.length > 0
                    ? filterableColumns.map(c => COLUMN_LABELS[c]).join(', ')
                    : '无';
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initSpreadsheet, 500);
        });

        window.addEventListener('error', (event) => {
            log(`💥 全局错误: ${event.message}`, 'error');
        });
    </script>
</body>
</html>
